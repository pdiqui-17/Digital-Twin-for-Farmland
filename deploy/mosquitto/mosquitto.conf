# Cấu hình Mosquitto cho môi trường dev local
# Bảo mật TLS và xác thực chứng chỉ trên K8s do Role C cấu hình riêng ở deploy/helm

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

listener 1883 0.0.0.0
allow_anonymous true
